name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: |
          python -m py_compile scripts/t3cfg.py
          python -m py_compile scripts/t3cfg_sync.py
          python -m py_compile templates/omp/omp-qwen.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Render all profiles
        run: |
          ./bin/t3cfg render --profile desktop --out /tmp/t3cfg-desktop
          ./bin/t3cfg render --profile laptop --out /tmp/t3cfg-laptop
          ./bin/t3cfg render --profile work --out /tmp/t3cfg-work
      - name: Cursor Plus guard fixtures
        run: |
          if ./bin/t3cfg guard --profile laptop --t3-userdata tests/fixtures/outage-laptop; then
            echo "ERROR: guard must fail on the outage fixture" >&2
            exit 1
          fi
          ./bin/t3cfg guard --profile laptop --t3-userdata tests/fixtures/canonical-cursor

name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: |
          python -m py_compile scripts/t3cfg.py
          python -m py_compile templates/omp/omp-qwen.py
          python -m py_compile templates/qwen/tailnet-gateway.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Render all profiles
        run: |
          ./bin/t3cfg render --profile desktop --out /tmp/t3cfg-desktop
          ./bin/t3cfg render --profile laptop --out /tmp/t3cfg-laptop
          ./bin/t3cfg render --profile server --out /tmp/t3cfg-server
